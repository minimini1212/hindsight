# 🔴 Gradle 데몬이 UTF-8 로 읽고 쓰게 한다
#
# 겪은 일 (2026-09-16): `./gradlew :demo-app:replay` 의 한글 출력이 통째로 깨졌다.
# 같은 글자를 `bin/hs.bat` 으로 찍으면 멀쩡했는데, Gradle 을 거치면 깨졌다.
#
# 왜 그런가: JavaExec 이 띄운 JVM 은 -Dstdout.encoding=UTF-8 로 UTF-8 «바이트»를 쓴다.
# 그런데 그걸 받아 읽는 것은 Gradle 데몬이고, 데몬의 file.encoding 이 윈도우 기본
# (MS949)이면 UTF-8 바이트를 MS949 로 해석한다. 그 자리에서 글자가 깨진다.
#
# 🔴 그러니까 자식 프로세스 쪽만 UTF-8 로 맞춰서는 «안 된다». 받는 쪽도 맞춰야 한다.
# 이건 검사로는 못 잡는다 — 돌려 보고 눈으로 봐야 보이는 종류다.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8 -Xmx2g
