# H2 — 파일도 서버도 없이 메모리에서 돈다. 앱을 끄면 사라진다.
# 🔴 그래도 커넥션 풀은 HikariCP 를 그대로 쓴다. 그래서 「풀 프록시 때문에 SQL 이
#    두 번 세이나」를 이 설정에서도 그대로 확인할 수 있다.
spring:
  datasource:
    url: jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
